<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select</title>
    <link rel="stylesheet" href="css/style.css">
<body>
    <div class="container">
        <div class="formulario">
            <form action="">
                <input type="text" name="nome" id="nome" placeholder="Digite seu nome">


                <!-- ? atributos ddas tags -->
                <!-- ? type = tipo do input (tipo do dado) -->
                <!-- ? name = vai ser usado só no backend -->
                <!-- ? id = para identificar no Javascript aquela tag-->
                <!-- ? placeholder = texto prévio na caixa de texto -->

                <select name="linguagem" id="linguagem">
                    <option value="0">Selecione uma linguagem</option>
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="csharp">C#</option>
                    <option value="ruby">Ruby</option>
                </select>
            </form>
            <button id ="selecionar">Selecione</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
